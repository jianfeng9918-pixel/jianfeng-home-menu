<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#285a3d">
  <meta name="description" content="剑锋家的家常菜单。挑好想吃的菜，记下口味，再把点菜单发给剑锋。">
  <meta name="robots" content="noindex,nofollow">
  <title>剑锋家菜单</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23285a3d'/%3E%3Ctext x='20' y='28' text-anchor='middle' font-size='27' fill='white' font-family='serif'%3E黄%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=menu-4">
  <script src="menu.js?v=menu-4" defer></script>
  <script src="images.js?v=menu-4" defer></script>
  <script src="app.js?v=menu-4" defer></script>
</head>
<body>
  <div class="app-shell">
    <header class="masthead">
      <div class="identity"><span class="home-mark" aria-hidden="true">黄</span><div><p class="eyebrow">剑锋家的私房菜</p><h1>剑锋家菜单</h1><p class="host-note">欢迎来家一起吃好吃的！</p></div></div>
      <div class="masthead-art" aria-hidden="true"><span>好菜</span><span>好聚</span><i></i></div>
    </header>
    <div class="toolbar"><span class="preference-title">今天想吃</span>
      <div id="taste-filters" class="taste-filters" aria-label="口味偏好"></div>
    </div>
    <div class="menu-layout">
      <nav id="categories" class="categories" aria-label="菜品分类"></nav>
      <main id="menu-main" class="menu-main">
        <section id="featured-section" class="featured-section" aria-labelledby="featured-title">
          <div class="block-heading"><div><p class="section-kicker">先尝尝家里的拿手菜</p><h2 id="featured-title">家里招牌<span class="heading-seal">六道拿手菜</span></h2></div><span class="block-index" aria-hidden="true">01</span></div>
          <div id="featured-list" class="featured-grid"></div>
        </section>
        <section id="signature-set" class="signature-set" aria-label="招牌套餐"></section>
        <section id="regular-menu" aria-labelledby="section-title">
          <div class="section-heading"><div><p class="section-kicker" id="section-kicker">荤素搭配，随心挑</p><h2 id="section-title">家常菜单</h2></div><span id="result-count" class="result-count"></span></div>
          <p id="filter-hint" class="filter-hint" hidden></p>
          <div id="dish-list"></div>
        </section>
        <div id="empty-state" class="empty-state" hidden><span aria-hidden="true">—</span><h3>暂时没有找到这道菜</h3><p>换个口味偏好，看看还有哪些好菜。</p><button type="button" id="reset-filters" class="text-button">查看全部菜品</button></div>
        <div class="menu-end"><p>还有想吃的？也可以告诉我。</p><button type="button" id="custom-request" class="text-button">写一道菜单外的菜 <span aria-hidden="true">＋</span></button></div>
        <footer class="small-footer"><span>家里的味道，慢慢挑。</span><button type="button" id="open-sources">图片来源</button></footer>
      </main>
    </div>
    <div class="cart-bar"><div id="table-balance" class="table-balance" hidden></div>
      <button type="button" class="cart-summary" id="open-cart" aria-label="查看点菜单"><span class="basket-icon"><svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m5 11 2.5 12h13L23 11Z" stroke-linejoin="round"/><path d="m9 11 5-7 5 7M11 15v4m6-4v4" stroke-linecap="round"/></svg><span id="cart-badge" hidden></span></span><span><strong id="cart-title">想吃什么，随心挑</strong><span id="cart-subtitle">选好后，把菜单发给剑锋</span></span></button>
      <button type="button" class="primary-button finish-button" id="finish" disabled>选好了 <span aria-hidden="true">→</span></button>
    </div>
  </div>
  <dialog id="cart-dialog" class="sheet" aria-labelledby="cart-dialog-title">
    <div class="sheet-header"><div><p class="eyebrow">选好了，就开饭</p><h2 id="cart-dialog-title">这次想吃</h2></div><button type="button" class="icon-button close-dialog" aria-label="关闭点菜单">×</button></div>
    <div class="sheet-body">
      <div class="cart-list-top"><span id="sheet-count"></span><button type="button" id="clear-cart" class="text-button muted">清空选择</button></div>
      <div id="cart-items"></div>
      <div class="guest-fields"><div class="preference-field"><span class="field-title">口味偏好</span><div id="cart-preferences" class="cart-preferences" aria-label="点菜单口味偏好"></div></div><label>口味与忌口 <span>选填</span><textarea id="guest-notes" rows="2" maxlength="20000" placeholder="例如：少辣、不放香菜"></textarea></label><details id="extra-details"><summary>菜单外还想吃一道</summary><label><input id="custom-dish" maxlength="80" aria-label="菜单外想吃的菜" placeholder="写下菜名，我看看能不能安排"></label></details></div>
      <p class="sheet-note">复制整份点菜单，粘贴到微信就好。</p>
    </div>
    <div class="sheet-actions"><button type="button" class="primary-button" id="copy-menu" disabled>复制菜单</button><button type="button" class="text-button close-dialog">继续选菜</button></div>
  </dialog>
  <dialog id="copy-dialog" class="small-dialog" aria-labelledby="copy-title"><div class="sheet-header"><h2 id="copy-title">长按复制这份菜单</h2><button type="button" class="icon-button close-dialog" aria-label="关闭复制文本">×</button></div><div class="sheet-body"><p>浏览器未能自动复制，请长按下方文字，选择全选、复制。</p><textarea id="copy-text" readonly rows="12" aria-label="可手动复制的完整点菜单"></textarea><button type="button" id="select-copy" class="primary-button">选中全部文字</button></div></dialog>
  <dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title"><div class="sheet-header"><h2 id="confirm-title">清空这次选择？</h2><button type="button" class="icon-button close-dialog" aria-label="取消清空">×</button></div><div class="sheet-body"><p>已选菜品和菜单外想吃的菜会清空，口味偏好与忌口保留。</p><div class="confirm-actions"><button type="button" class="secondary-button close-dialog">继续保留</button><button type="button" id="confirm-clear" class="primary-button">清空选择</button></div></div></dialog>
  <dialog id="sources-dialog" class="small-dialog" aria-labelledby="sources-title"><div class="sheet-header"><h2 id="sources-title">图片来源</h2><button type="button" class="icon-button close-dialog" aria-label="关闭图片来源">×</button></div><div id="source-list" class="sheet-body source-list"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><p class="noscript">请开启浏览器 JavaScript 后使用点菜功能。</p></noscript>
</body>
</html>
